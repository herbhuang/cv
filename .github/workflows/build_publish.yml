---
name: Build and Publish CV

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cv-r2-publish
  cancel-in-progress: true

env:
  # Pinned so CI and the local docker image produce byte-comparable Word files.
  PANDOC_VERSION: '3.10'
  ASSETS_BASE: https://assets.huanghe.phd

jobs:
  build_latex:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Build all CV PDFs
        uses: xu-cheng/latex-action@v4
        with:
          # latexmk multi-pass; three entry points share _cv-content.tex
          root_file: |
            cv-hhuang.tex
            cv-hhuang.short.tex
            cv-hhuang-onepage.tex

      - name: Stage PDFs for R2
        run: |
          mkdir -p dist/pdf
          cp cv-hhuang.pdf dist/pdf/cv-hhuang.pdf
          cp cv-hhuang.short.pdf dist/pdf/cv-hhuang.short.pdf
          cp cv-hhuang-onepage.pdf dist/pdf/cv-hhuang.onepage.pdf
          ls -la dist/pdf/

      - name: Install pandoc
        run: |
          url="https://github.com/jgm/pandoc/releases/download"
          deb="pandoc-${PANDOC_VERSION}-1-amd64.deb"
          if curl --silent --show-error --location --fail --retry 3 \
              --output /tmp/pandoc.deb \
              "${url}/${PANDOC_VERSION}/${deb}"; then
            sudo dpkg --install /tmp/pandoc.deb
          else
            echo "::warning::pandoc ${PANDOC_VERSION} unavailable; using apt"
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends pandoc
          fi
          pandoc --version | head -1

      # Same _cv-content.tex the PDFs came from, via scripts/tex2html.py.
      # tex2html.py exits non-zero on a macro it does not know, so a new macro
      # breaks the build here rather than silently dropping content.
      - name: Build Word versions
        run: |
          # A .docx is a zip; without SOURCE_DATE_EPOCH its entry timestamps
          # are the build clock, so two builds of identical content differ
          # byte for byte and the verify step below cannot tell a stale copy
          # from a fresh rebuild. Pinning it to the commit makes the output a
          # pure function of the source.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          DIST=dist/docx ./scripts/build-docx.sh
          rm -f dist/docx/reference.docx dist/docx/*.html
          ls -la dist/docx/

      - name: Upload PDFs to Cloudflare R2
        uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.R2_BUCKET }}
          source-dir: dist/pdf
          destination-dir: pdf/

      - name: Upload Word versions to Cloudflare R2
        uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.R2_BUCKET }}
          source-dir: dist/docx
          destination-dir: docx/

      # Replacing an R2 object does not invalidate copies already held at the
      # Cloudflare edge. Purge only the objects uploaded above so each
      # successful export becomes visible immediately.
      #
      # Skipped while the two secrets are unset, which is a stopgap and not a
      # statement that purging is unnecessary. Measured 2026-08-22: for several
      # minutes after an upload the plain URL served the *previous* object
      # while the same path with a cache-busting query string served the new
      # one -- and this despite cf-cache-status reporting DYNAMIC, so that
      # header is not evidence the response is uncached. The window closes on
      # its own, but until both secrets exist a fresh push is briefly invisible
      # to anyone following the published link.
      - name: Purge uploaded files from Cloudflare cache
        id: purge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ZONE_ID}" ]]; then
            echo "::warning::Cloudflare secrets unset; skipping the cache purge."
            echo "purged=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          purge_payload="$(
            find dist/pdf dist/docx -type f \
              | sed "s|^dist/|${ASSETS_BASE}/|" \
              | jq -Rnc '{files: [inputs]}'
          )"
          echo "${purge_payload}"

          response="$(curl --silent --show-error --fail-with-body \
            --retry 3 --retry-all-errors \
            --request POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "${purge_payload}")"

          if ! jq -e '.success == true' <<<"${response}" >/dev/null; then
            jq . <<<"${response}" >&2
            exit 1
          fi
          echo "purged=true" >> "${GITHUB_OUTPUT}"

      # Two different questions, kept apart. Did the upload land? -- ask the
      # origin, via a cache-busting query string, which is a distinct cache key
      # and so bypasses whatever the edge is holding. Is the edge serving it? --
      # only meaningful once the purge has run, so it is checked only then.
      # Measured 2026-08-22: with the purge skipped the plain URL served a
      # previous object indefinitely and inconsistently between edges, so
      # asserting on it here would fail forever rather than catch anything.
      - name: Verify published files
        env:
          PURGED: ${{ steps.purge.outputs.purged }}
        run: |
          published_dir="$(mktemp -d)"
          trap 'rm -rf "${published_dir}"' EXIT
          cb="$(date +%s)$$"
          fail=0

          # A `find | while` runs in a subshell, where the failure flag would
          # not survive -- read the list first.
          mapfile -t staged < <(find dist/pdf dist/docx -type f | sort)
          for src in "${staged[@]}"; do
            key="${src#dist/}"                         # pdf/x.pdf, docx/x.docx
            got="${published_dir}/$(basename "${key}")"

            for attempt in {1..4}; do
              if curl --silent --show-error --fail \
                  --output "${got}" "${ASSETS_BASE}/${key}?cb=${cb}" \
                  && cmp --silent "${src}" "${got}"; then
                echo "ok        ${key}"
                break
              fi

              if [[ "${attempt}" == "4" ]]; then
                echo "::error::R2 does not serve the new ${key}"
                fail=1
              fi

              sleep "$(( 2 ** attempt ))"
            done

            [[ "${PURGED}" == "true" ]] || continue

            if curl --silent --show-error --fail \
                --output "${got}" "${ASSETS_BASE}/${key}" \
                && cmp --silent "${src}" "${got}"; then
              echo "ok/edge   ${key}"
            else
              echo "::error::Edge still serves a stale ${key} after the purge"
              fail=1
            fi
          done

          if [[ "${PURGED}" != "true" ]]; then
            echo "::warning::Edge freshness unverified: the purge was skipped," \
                 "so ${ASSETS_BASE} may serve an older copy for a while."
          fi

          exit "${fail}"
